<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <!-- Filled in when livesaver serves the page from this computer: then it can also fix. -->
    <meta name="livesaver-local" content="">
    <title>livesaver</title>
    <meta
      name="description"
      content="Find and fix missing samples and plug-in problems in your Ableton Live projects."
    >
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <script>
    // Before the first paint, so the page does not flash in the other colour scheme.
    ;(() => {
      const mode = localStorage.getItem('vueuse-color-scheme') || 'auto'
      const dark =
        mode === 'dark' ||
        (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
    })()
    </script>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
